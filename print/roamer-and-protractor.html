<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roamer and protractor — 2434 Squadron</title>
<!--
  Cut-out roamers and a bearing protractor, drawn for 1:25 000 to match
  print/practice-map.html. 100 m = 4 mm, so every graduation here is 4 mm.

  Depends entirely on printing at 100% on A4. There is a 40 mm check line.
  Self-contained, like the animations, so it works off a USB stick.
-->
<style>
  html, body { margin: 0; padding: 0; background: #F4F1EA; }
  body { font-family: 'IBM Plex Sans', system-ui, -apple-system, Segoe UI, sans-serif; color: #211F1B; }
  .bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 18px; background: #211F1B; color: #F4F1EA; }
  .bar h1 { margin: 0; font-size: 16px; font-weight: 600; flex: 1 1 auto; }
  .bar button { border: 0; cursor: pointer; background: #E4572E; color: #fff; padding: 11px 18px; border-radius: 7px; font: 500 14px inherit; min-height: 44px; }
  .bar span { font-size: 13px; opacity: 0.75; flex: 1 1 100%; line-height: 1.5; }
  .sheet { width: 210mm; height: 297mm; margin: 16px auto; background: #fff; box-shadow: 0 6px 26px rgba(0,0,0,0.18); }
  svg { display: block; width: 100%; height: 100%; }
  @page { size: A4 portrait; margin: 0; }
  @media print {
    html, body { background: #fff; }
    .bar { display: none; }
    .sheet { width: 210mm; height: 297mm; margin: 0; box-shadow: none; }
  }
</style>
</head>
<body>

<div class="bar">
  <h1>Roamer and protractor</h1>
  <button onclick="window.print()">Print this sheet</button>
  <span>Print at <strong>100% / actual size</strong>. Check the 40&nbsp;mm line before cutting anything out — at the wrong size every measurement will be wrong. Card or acetate is better than paper if you have it.</span>
</div>

<div class="sheet">
<svg viewBox="0 0 210 297" xmlns="http://www.w3.org/2000/svg">
  <rect width="210" height="297" fill="#ffffff"/>

  <text x="12" y="14" font-size="5" font-weight="600">Roamer and protractor — 1:25 000</text>
  <text x="12" y="20.5" font-size="3.1" fill="#6B6252">Cut along the dashed lines. Use with the practice map sheet. 100 m = 4 mm at this scale.</text>

  <!-- print-size check -->
  <g transform="translate(12,27)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#8C2F1B" stroke-width="0.5"/>
    <line x1="0" y1="-1.6" x2="0" y2="1.6" stroke="#8C2F1B" stroke-width="0.5"/>
    <line x1="40" y1="-1.6" x2="40" y2="1.6" stroke="#8C2F1B" stroke-width="0.5"/>
    <text x="43" y="1.1" font-size="2.9" fill="#8C2F1B" font-weight="600">Measure this first: it must be exactly 40 mm (= 1 km).</text>
  </g>

  <!-- ======================= PROTRACTOR ======================= -->
  <text x="12" y="40" font-size="3.6" font-weight="600">Bearing protractor</text>
  <text x="12" y="45" font-size="2.8" fill="#6B6252">Centre on your start point, keep 0° to Grid North (up the map), read the bearing off the edge.</text>

  <g transform="translate(105,105)">
    <circle cx="0" cy="0" r="52" fill="none" stroke="#211F1B" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#C9C0AC" stroke-width="0.25"/>

    <!-- degree ticks: every 1 small, 5 medium, 10 long -->
    <g stroke="#211F1B">
      <!-- generated by hand in 10-degree groups to keep the file self-contained -->
      <g id="ticks"></g>
    </g>

    <!-- cross hairs -->
    <line x1="-52" y1="0" x2="52" y2="0" stroke="#C9C0AC" stroke-width="0.25"/>
    <line x1="0" y1="-52" x2="0" y2="52" stroke="#C9C0AC" stroke-width="0.25"/>
    <circle cx="0" cy="0" r="1.1" fill="none" stroke="#8C2F1B" stroke-width="0.4"/>
    <line x1="-3" y1="0" x2="3" y2="0" stroke="#8C2F1B" stroke-width="0.3"/>
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#8C2F1B" stroke-width="0.3"/>

    <text x="0" y="-54.5" font-size="3.4" font-weight="600" text-anchor="middle" fill="#8C2F1B">GRID NORTH</text>
  </g>
  <!-- cut line for the protractor -->
  <circle cx="105" cy="105" r="55" fill="none" stroke="#9A907C" stroke-width="0.3" stroke-dasharray="1.8 1.6"/>

  <!-- ======================= ROAMERS ======================= -->
  <text x="12" y="186" font-size="3.6" font-weight="600">Roamers — cut out one each</text>
  <text x="12" y="191" font-size="2.8" fill="#6B6252">Put the corner on your point. Read <tspan font-weight="600">along the bottom first</tspan> (eastings), then up the side (northings).</text>

  <g id="roamers"></g>

  <text x="12" y="290" font-size="2.5" fill="#9A907C">2434 Squadron Training Hub · 1:25 000 · print at 100% on A4 · check the 40 mm line before use</text>
</svg>
</div>

<script>
/* The ticks and the four roamers are drawn here rather than typed out by hand -
   360 degree marks and 40 graduations would be unreadable as literal SVG. It is
   still one self-contained file with no outside dependency, which is the rule
   the animations follow. */
(function () {
  var SVGNS = 'http://www.w3.org/2000/svg';
  function el(name, attrs, text) {
    var n = document.createElementNS(SVGNS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }

  /* ---- protractor ticks and labels ---- */
  var ticks = document.getElementById('ticks');
  var labels = el('g', { 'font-size': '3', 'text-anchor': 'middle', fill: '#211F1B' });
  for (var d = 0; d < 360; d++) {
    var long = (d % 10 === 0), mid = (d % 5 === 0);
    var r1 = 52, r2 = long ? 44.5 : mid ? 47.5 : 49.8;
    var a = (d - 90) * Math.PI / 180;           // 0 degrees at the top
    ticks.appendChild(el('line', {
      x1: (r1 * Math.cos(a)).toFixed(2), y1: (r1 * Math.sin(a)).toFixed(2),
      x2: (r2 * Math.cos(a)).toFixed(2), y2: (r2 * Math.sin(a)).toFixed(2),
      'stroke-width': long ? 0.45 : mid ? 0.3 : 0.18
    }));
    if (d % 30 === 0) {
      var rl = 40;
      labels.appendChild(el('text', {
        x: (rl * Math.cos(a)).toFixed(2),
        y: (rl * Math.sin(a) + 1.1).toFixed(2)
      }, d === 0 ? '000' : String(d).padStart(3, '0')));
    }
  }
  ticks.parentNode.parentNode.appendChild(labels);

  /* ---- four cut-out roamers ---- */
  var host = document.getElementById('roamers');
  var MM_PER_100M = 4;                          // 1:25 000
  var positions = [[12, 202], [62, 202], [112, 202], [162, 202]];

  positions.forEach(function (p, i) {
    var g = el('g', { transform: 'translate(' + p[0] + ',' + p[1] + ')' });

    // Cut outline. It has to enclose the title and BOTH sets of graduation
    // labels - cut through those and the roamer is unreadable.
    g.appendChild(el('rect', {
      x: -4, y: -9, width: 47, height: 58, fill: 'none',
      stroke: '#9A907C', 'stroke-width': 0.3, 'stroke-dasharray': '1.8 1.6'
    }));

    // the two working edges
    g.appendChild(el('line', { x1: 0, y1: 40, x2: 40, y2: 40, stroke: '#211F1B', 'stroke-width': 0.5 }));
    g.appendChild(el('line', { x1: 0, y1: 0, x2: 0, y2: 40, stroke: '#211F1B', 'stroke-width': 0.5 }));

    // graduations every 100 m, longer every 500 m
    for (var n = 0; n <= 10; n++) {
      var off = n * MM_PER_100M;
      var big = (n % 5 === 0);
      // along the bottom (eastings)
      g.appendChild(el('line', {
        x1: off, y1: 40, x2: off, y2: 40 - (big ? 4 : 2.2),
        stroke: '#211F1B', 'stroke-width': big ? 0.4 : 0.25
      }));
      // up the side (northings)
      g.appendChild(el('line', {
        x1: 0, y1: 40 - off, x2: (big ? 4 : 2.2), y2: 40 - off,
        stroke: '#211F1B', 'stroke-width': big ? 0.4 : 0.25
      }));
      if (big) {
        // The end labels are anchored inwards so they cannot spill past the cut.
        g.appendChild(el('text', {
          x: off, y: 44.4, 'font-size': 2.4, fill: '#211F1B',
          'text-anchor': n === 0 ? 'start' : n === 10 ? 'end' : 'middle'
        }, n === 0 ? '0' : (n * 100)));
        if (n > 0) g.appendChild(el('text', {
          x: 5.4, y: 40 - off + 0.9, 'font-size': 2.4, fill: '#211F1B'
        }, n * 100));
      }
    }

    g.appendChild(el('text', { x: 0, y: -5.4, 'font-size': 2.6, 'font-weight': 600, fill: '#211F1B' }, 'Roamer 1:25 000'));
    g.appendChild(el('text', { x: 0, y: -1.8, 'font-size': 2.2, fill: '#6B6252' }, 'metres · corner on your point'));
    host.appendChild(g);
  });
})();
</script>

</body>
</html>
